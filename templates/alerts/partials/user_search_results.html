{% if users %}
  <ul class="menu bg-base-200 w-full rounded-box mt-1 absolute z-50 shadow-lg border border-base-300">
    {% for user in users %}
      <li>
        <a @click.prevent="addUser({{ user.id }}, '{{ user.get_display_name|escapejs }}', '{{ user.email|escapejs }}')">
          <div class="flex items-center gap-3">
            <div class="avatar">
              <div class="w-8 rounded-full">
                <img src="{{ user.avatar_url }}" alt="{{ user.get_display_name }}" />
              </div>
            </div>
            <div>
              <div class="font-bold">{{ user.get_display_name }}</div>
              <div class="text-xs opacity-70">{{ user.email }}</div>
            </div>
          </div>
        </a>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <div class="p-4 bg-base-200 text-xs text-base-content/50 rounded-box mt-1 absolute z-50 shadow-lg border border-base-300 w-full font-bold">
    No team members found matching your search.
  </div>
{% endif %}
