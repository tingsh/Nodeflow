<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ period_label }} Business Impact Review</title>
  <style>
    @page { size: A4; margin: 18mm; }
    body { color: #172033; font-family: Arial, sans-serif; font-size: 11px; line-height: 1.45; margin: 0; }
    h1 { font-size: 24px; margin: 4px 0; } h2 { border-bottom: 1px solid #dbe2ea; font-size: 15px; margin-top: 24px; padding-bottom: 6px; }
    .muted { color: #64748b; } .eyebrow { color: #2563eb; font-size: 9px; font-weight: bold; letter-spacing: 1.4px; text-transform: uppercase; }
    .grid { display: table; table-layout: fixed; width: 100%; } .card { border: 1px solid #dbe2ea; display: table-cell; padding: 12px; width: 20%; }
    .label { color: #64748b; font-size: 8px; font-weight: bold; text-transform: uppercase; } .value { font-size: 17px; font-weight: bold; margin-top: 4px; }
    table { border-collapse: collapse; width: 100%; } th, td { border-bottom: 1px solid #e5eaf0; padding: 7px; text-align: left; vertical-align: top; }
    th { color: #64748b; font-size: 8px; text-transform: uppercase; } .badge { background: #eef2f7; border-radius: 8px; font-size: 8px; padding: 2px 6px; text-transform: uppercase; }
    .notice { background: #fff8e6; border: 1px solid #f0d38a; margin: 16px 0; padding: 10px; }
  </style>
</head>

</body>
</html>
