{% if commissioning %}
<div class="rounded-lg border border-base-content/10 bg-base-100 p-4 shadow-sm">
    <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between mb-4">
        <div>
            <h3 class="text-sm font-bold uppercase tracking-wide text-base-content/60">Guided Setup progress</h3>
            <p class="text-xs text-base-content/55 mt-1">{{ commissioning.status_message }}</p>
        </div>
        <span class="inline-flex items-center rounded-md bg-base-200 px-3 py-1 text-xs font-semibold text-base-content/60">
            {{ commissioning.primary_action.label }}
        </span>
    </div>
    <div class="grid grid-cols-1 gap-2 sm:grid-cols-3">
        {% for item in commissioning.checklist %}
        <div class="flex items-center gap-2 rounded-md border px-3 py-2 text-xs {% if item.complete %}border-green-200 bg-green-50 text-green-800 dark:border-green-500/30 dark:bg-green-500/10 dark:text-green-300{% elif item.current %}border-primary/30 bg-primary/5 text-primary{% else %}border-base-content/10 bg-base-200/30 text-base-content/45{% endif %}">
            <span class="flex h-5 w-5 items-center justify-center rounded-full text-[10px] {% if item.complete %}bg-green-600 text-white{% elif item.current %}bg-primary text-primary-content{% else %}bg-base-content/10 text-base-content/40{% endif %}">
                {% if item.complete %}<i class="fa fa-check"></i>{% elif item.current %}<i class="fa fa-arrow-right"></i>{% else %}<i class="fa fa-minus"></i>{% endif %}
            </span>
            <span class="font-semibold">{{ item.label }}</span>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
