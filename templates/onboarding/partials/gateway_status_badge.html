{% if status == "online" %}
<div class="p-5">
    <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-md bg-green-100 text-green-700 dark:bg-green-500/10 dark:text-green-300">
            <i class="fa fa-check"></i>
        </div>
        <div>
            <p class="text-sm font-bold text-base-content">Gateway is online</p>
            <p class="text-xs text-base-content/55">{{ commissioning.gateway_state.display|default:"Heartbeat received" }}</p>
        </div>
    </div>
</div>
<script>
    const btn = document.getElementById('continue-btn');
    if (btn && "{{ commissioning.readiness.status }}" === "ready") {
      btn.classList.remove('opacity-50', 'pointer-events-none');
      btn.removeAttribute('aria-disabled');
    }
</script>
{% else %}
<div class="flex items-center gap-3 p-5">
    <span class="loading loading-spinner loading-sm text-primary"></span>
    <div>
        <p class="text-sm font-medium text-base-content/65">Waiting for gateway to connect...</p>
        <p class="mt-0.5 text-xs text-base-content/45">This usually takes 30-60 seconds after power and network are connected.</p>
    </div>
</div>
{% endif %}
