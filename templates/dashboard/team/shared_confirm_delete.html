{% extends "web/app/app_base.html" %}

{% block app %}
<div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white dark:bg-gray-800 shadow rounded-lg overflow-hidden border border-red-100 dark:border-red-900">
        <div class="px-6 py-5 border-b border-red-100 dark:border-red-900 bg-red-50 dark:bg-red-900/30 flex items-center space-x-3">
            <div class="p-2 bg-red-100 dark:bg-red-800 rounded-lg">
                <i class="fa fa-triangle-exclamation text-red-600 dark:text-red-400"></i>
            </div>
            <h3 class="text-xl font-medium leading-6 text-red-900 dark:text-red-100">
                Confirm Deletion
            </h3>
        </div>
        
        <form method="post" class="p-6">
            {% csrf_token %}
            <p class="text-gray-700 dark:text-gray-300 mb-6">
                Are you sure you want to delete the shared link <strong>"{{ object.name }}"</strong>? 
                This action cannot be undone, and anyone using this link will immediately lose access.
            </p>
            
            <div class="flex justify-end space-x-3">
                <a href="{% url 'web_team:dashboard_team:list' request.team.slug %}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn bg-red-600 hover:bg-red-700 text-white border-0">Yes, Delete Link</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
