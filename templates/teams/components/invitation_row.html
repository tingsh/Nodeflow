{% load i18n team_permissions %}
<tr class="hover">
  <td class="font-medium text-base-content">{{ invitation.email }}</td>
  <td class="text-base-content/70">{{ invitation.created_at|date:"M j, Y" }}</td>
  <td>
    <span class="badge badge-ghost badge-sm">
      {{ invitation.get_role_display }}
    </span>
  </td>
{% has_perm 'manage_team' as can_manage_team %}
{% if can_manage_team %}
  <td class="text-right">
    <div class="flex items-center justify-end space-x-2">
      <form hx-post="{% url 'single_team:resend_invitation' request.team.slug invitation.id %}" hx-target="this" hx-swap="outerHTML">
        {% csrf_token %}
        <button type="submit" class="btn btn-sm btn-outline">
          <i class="fa fa-paper-plane mr-1"></i> {% translate "Resend" %}
        </button>
      </form>
      <form hx-post="{% url 'single_team:cancel_invitation' request.team.slug invitation.id %}" hx-target="closest tr" hx-swap="outerHTML swap:1s">
        {% csrf_token %}
        <button type="submit" class="btn btn-sm btn-error btn-outline">
          <i class="fa fa-times mr-1"></i> {% translate "Cancel" %}
        </button>
      </form>
    </div>
  </td>
{% endif %}
</tr>
