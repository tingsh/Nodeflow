{% load i18n %}
<div class="py-32 bg-indigo-600 text-white relative overflow-hidden">
    <div class="absolute top-0 right-0 w-96 h-96 bg-white/10 blur-3xl rounded-full -translate-y-1/2 translate-x-1/3"></div>
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
        <h2 class="text-5xl font-black font-heading mb-6 tracking-tight">{{ self.title }}</h2>
        <p class="text-xl text-indigo-100 mb-10 max-w-2xl mx-auto">{{ self.subtitle }}</p>
        <div class="flex flex-col sm:flex-row justify-center gap-4">
            <a href="{{ self.primary_cta_url }}" class="btn bg-white text-indigo-600 hover:bg-gray-50 border-none rounded-2xl h-14 px-8 font-black uppercase tracking-widest">{{ self.primary_cta_text }}</a>
            {% if self.secondary_cta_url %}
                <a href="{{ self.secondary_cta_url }}" class="btn btn-ghost border-2 border-white/20 hover:bg-white/10 text-white rounded-2xl h-14 px-8 font-black uppercase tracking-widest">{{ self.secondary_cta_text }}</a>
            {% endif %}
        </div>
    </div>
</div>
