{% load i18n %}
<div class="py-24 bg-base-content text-base-100 overflow-hidden relative">
    <div class="absolute inset-0 bg-indigo-500/10 mix-blend-overlay"></div>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
            <div>
                {% if self.tagline %}
                    <span class="text-indigo-400 font-black text-xs uppercase tracking-widest bg-indigo-500/10 px-3 py-1 rounded-full mb-6 inline-block">{{ self.tagline }}</span>
                {% endif %}
                <h2 class="text-4xl md:text-5xl font-black mb-6 font-heading leading-tight">{{ self.title|safe }}</h2>
                <p class="text-base-100/70 text-lg mb-8 leading-relaxed">{{ self.body }}</p>
            </div>
            <div class="bg-base-100 rounded-3xl p-6 shadow-2xl border border-white/10 text-base-content">
                <div class="flex items-start gap-4 mb-6">
                    <div class="w-10 h-10 rounded-full bg-base-200 flex items-center justify-center shrink-0">
                        <i class="fa fa-user text-base-content/50 text-sm"></i>
                    </div>
                    <div class="bg-base-200 p-4 rounded-2xl rounded-tl-none">
                        <p class="text-sm font-medium">{{ self.prompt_text }}</p>
                    </div>
                </div>
                <div class="flex items-start gap-4">
                    <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center shrink-0 shadow-lg shadow-indigo-600/30">
                        <i class="fa fa-robot text-white text-sm"></i>
                    </div>
                    <div class="bg-indigo-50 p-4 rounded-2xl rounded-tl-none border border-indigo-100/50">
                        {% if self.response_tagline %}
                            <p class="text-xs font-black text-indigo-600 uppercase tracking-widest mb-1">{{ self.response_tagline }}</p>
                        {% endif %}
                        <p class="text-sm text-indigo-950 font-medium leading-relaxed">{{ self.response_text }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
