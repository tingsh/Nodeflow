{% load i18n %}
<section class="bg-white py-24">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="max-w-3xl">
      {% if self.tagline %}
        <p class="mb-3 text-xs font-bold uppercase tracking-widest text-sky-700">{{ self.tagline }}</p>
      {% endif %}
      <h2 class="text-3xl font-bold font-heading tracking-normal text-slate-950 sm:text-4xl">{{ self.title }}</h2>
    </div>
    <div class="mt-12 grid gap-6 md:grid-cols-3">
      {% for feature in self.features %}
        <article class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
          <div class="mb-5 flex h-10 w-10 items-center justify-center rounded-md bg-slate-100 text-sky-700">
            <i class="fa {{ feature.icon }}"></i>
          </div>
          <h3 class="text-lg font-bold text-slate-950">{{ feature.title }}</h3>
          <p class="mt-3 text-sm leading-6 text-slate-600">{{ feature.description }}</p>
          {% if feature.link_url %}
            <a href="{{ feature.link_url }}" class="mt-5 inline-flex text-sm font-bold text-sky-700 hover:text-sky-900">
              {{ feature.link_text|default:"Learn more" }} <i class="fa fa-arrow-right ml-2 mt-1 text-xs"></i>
            </a>
          {% endif %}
        </article>
      {% endfor %}
    </div>
  </div>
</section>
