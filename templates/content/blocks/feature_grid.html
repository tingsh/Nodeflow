{% load i18n %}
<div class="py-24 bg-base-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-16">
            {% if self.tagline %}
                <h3 class="text-indigo-600 font-bold tracking-widest uppercase text-sm mb-4">{{ self.tagline }}</h3>
            {% endif %}
            <h2 class="text-4xl md:text-5xl font-black text-base-content font-heading tracking-tight max-w-3xl mx-auto">{{ self.title }}</h2>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            {% for feature in self.features %}
                <div class="bg-base-200/50 rounded-3xl p-8 hover:bg-base-200 transition-colors border border-base-content/5">
                    <div class="w-14 h-14 bg-indigo-500/10 text-indigo-600 rounded-2xl flex items-center justify-center text-xl mb-6">
                        <i class="fa {{ feature.icon }}"></i>
                    </div>
                    <h3 class="text-xl font-bold text-base-content mb-4">{{ feature.title }}</h3>
                    <p class="text-base-content/70 text-sm leading-relaxed mb-6">{{ feature.description }}</p>
                    {% if feature.link_url %}
                        <a href="{{ feature.link_url }}" class="text-indigo-600 font-bold text-sm flex items-center hover:text-indigo-700">
                            {{ feature.link_text|default:"Learn more" }} <i class="fa fa-arrow-right ml-2 text-xs"></i>
                        </a>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
    </div>
</div>
