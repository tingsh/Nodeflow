{% load i18n %}
<section class="bg-slate-950 py-12 text-white">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="grid gap-8 lg:grid-cols-[1.2fr_2fr] lg:items-center">
      <div>
        {% if self.tagline %}
          <p class="mb-3 text-xs font-bold uppercase tracking-widest text-sky-300">{{ self.tagline }}</p>
        {% endif %}
        {% if self.title %}
          <h2 class="max-w-xl text-2xl font-bold font-heading tracking-normal text-white">{{ self.title }}</h2>
        {% endif %}
      </div>
      <dl class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
        {% for metric in self.metrics %}
          <div class="border-l border-white/15 pl-5">
            <dt class="text-3xl font-bold tracking-normal text-white">{{ metric.value }}</dt>
            <dd class="mt-1 text-sm font-semibold text-slate-200">{{ metric.label }}</dd>
            {% if metric.detail %}
              <dd class="mt-2 text-xs leading-5 text-slate-400">{{ metric.detail }}</dd>
            {% endif %}
          </div>
        {% endfor %}
      </dl>
    </div>
  </div>
</section>
