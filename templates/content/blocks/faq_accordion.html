{% load i18n %}
<section class="bg-white py-20">
  <div class="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8">
    {% if self.title %}
      <h2 class="mb-10 text-3xl font-bold font-heading tracking-normal text-slate-950">{{ self.title }}</h2>
    {% endif %}
    <div class="divide-y divide-slate-200 rounded-lg border border-slate-200 bg-white">
      {% for faq in self.faqs %}
        <details class="group p-6">
          <summary class="flex cursor-pointer list-none items-center justify-between gap-4 text-base font-bold text-slate-950">
            {{ faq.question }}
            <i class="fa fa-chevron-down text-sm text-slate-400 transition-transform group-open:rotate-180"></i>
          </summary>
          <p class="mt-4 text-sm leading-6 text-slate-600">{{ faq.answer }}</p>
        </details>
      {% endfor %}
    </div>
  </div>
</section>
