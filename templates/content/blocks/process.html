{% load i18n %}
<section class="bg-slate-50 py-24">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="max-w-3xl">
      {% if self.tagline %}
        <p class="mb-3 text-xs font-bold uppercase tracking-widest text-sky-700">{{ self.tagline }}</p>
      {% endif %}
      <h2 class="text-3xl font-bold font-heading tracking-normal text-slate-950 sm:text-4xl">{{ self.title }}</h2>
    </div>
    <div class="mt-12 grid gap-6 md:grid-cols-3">
      {% for step in self.steps %}
        <article class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
          <p class="text-xs font-bold uppercase tracking-widest text-sky-700">{{ step.step }}</p>
          <h3 class="mt-4 text-xl font-bold text-slate-950">{{ step.title }}</h3>
          <p class="mt-3 text-sm leading-6 text-slate-600">{{ step.description }}</p>
        </article>
      {% endfor %}
    </div>
  </div>
</section>
