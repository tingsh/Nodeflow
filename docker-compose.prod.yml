services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    env_file:
      - path: ./deploy/env/production.env.example
        required: true
      - path: ./deploy/env/production.env
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./deploy/mosquitto/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/data:/mosquitto/data
      - /etc/letsencrypt/live/mqtt.novenaplatform.com/fullchain.pem:/mosquitto/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/mqtt.novenaplatform.com/privkey.pem:/mosquitto/certs/privkey.pem:ro
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/#' -C 1 -W 5 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - path: ./deploy/env/production.env.example
        required: true
      - path: ./deploy/env/production.env
        required: false
    command: >
      gunicorn novena_hub.asgi:application
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --workers ${WEB_CONCURRENCY:-2}
      --timeout 120
      --access-logfile -
      --error-logfile -
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./media:/code/media
      - ./static_root:/code/static_root
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - path: ./deploy/env/production.env.example
        required: true
      - path: ./deploy/env/production.env
        required: false
    command: ["celery", "-A", "novena_hub", "worker", "-l", "INFO", "--concurrency", "2"]
    volumes:
      - ./media:/code/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - path: ./deploy/env/production.env.example
        required: true
      - path: ./deploy/env/production.env
        required: false
    command: ["celery", "-A", "novena_hub", "beat", "-l", "INFO", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mqtt-consumer:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - path: ./deploy/env/production.env.example
        required: true
      - path: ./deploy/env/production.env
        required: false
    command: ["python", "manage.py", "mqtt_consumer"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  mosquitto_log:
