persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

per_listener_settings true

# Internal listener for Hub services inside the Docker network.
listener 1883 0.0.0.0
allow_anonymous true

# Private Dynamic Security control listener. Do not publish this port.
listener 1884 0.0.0.0
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Public gateway listener. Expose only this listener through the host firewall.
listener 8883 0.0.0.0
cafile /mosquitto/certs/fullchain.pem
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
